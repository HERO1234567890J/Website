# ─── D-Trips frontend — nginx config (§22) ─────────────────────────
#
# Serves the Vite-built SPA and reverse-proxies /api/* to the
# NestJS backend. In docker-compose the backend container is
# reachable as "backend" on port 3001.
#
# In production behind a TLS-terminating proxy (§22), this config
# receives plain HTTP from the upstream; TLS is handled at the
# edge (see deploy/nginx/conf.d/default.conf for Let's Encrypt).
# ────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─── Reverse proxy: /api → NestJS backend ──────────────────────
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 60s;
    }

    # ─── Static asset caching (Vite hashed filenames) ──────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── SPA fallback — every non-file route → index.html ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Security headers (§18) ────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ─── Disable .dotfile access ───────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
