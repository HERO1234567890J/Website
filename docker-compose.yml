# ─── D-Trips — Docker Compose (§22) ────────────────────────────────
#
# Production stack: PostgreSQL + NestJS backend + nginx frontend.
#
# Usage:
#   cp .env.example .env    # fill in real secrets
#   docker compose up -d --build
#   docker compose logs -f
#
# First deploy (or after schema changes):
#   docker compose exec backend npx prisma migrate deploy
# ────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtrips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtrips}
      POSTGRES_DB: ${POSTGRES_DB:-dtrips}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtrips}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── NestJS backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-dtrips}:${POSTGRES_PASSWORD:-dtrips}@db:5432/${POSTGRES_DB:-dtrips}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      APP_URL: ${APP_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost:3001}
      EASYCASH_BASE_URL: ${EASYCASH_BASE_URL:-}
      EASYCASH_API_KEY: ${EASYCASH_API_KEY:-}
      EASYCASH_WEBHOOK_SECRET: ${EASYCASH_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-bookings@d-trips.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-hello@d-trips.com}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-}
      BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY:-}
      BUNNY_CDN_BASE: ${BUNNY_CDN_BASE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-3001}:3001"

  # ─── Frontend (nginx SPA + /api reverse proxy) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
