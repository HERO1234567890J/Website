# ─── D-Trips — CI (§32) ───────────────────────────────────────────
#
# On every pull request → install, lint, typecheck, test, build.
# Blocks merge on failure.
# ────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ────────────────────────────────────────────────────
  backend:
    name: Backend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dtrips
          POSTGRES_PASSWORD: dtrips
          POSTGRES_DB: dtrips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtrips"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://dtrips:dtrips@localhost:5432/dtrips_test
          JWT_SECRET: ci-test-jwt-secret-0123456789abcdef
          JWT_REFRESH_SECRET: ci-test-refresh-secret-0123456789
          NODE_ENV: test
          PORT: 3001
          APP_URL: http://localhost:3000
          API_URL: http://localhost:3001

      - name: Build
        run: npm run build

  # ─── Frontend ───────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
